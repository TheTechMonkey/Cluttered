org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn
# The Minecraft version must agree with the Fabric API target to get a valid artifact.
minecraft_version=26.3
minecraft_version_range=~26.3
loader_version=0.19.5
loader_version_range=>=0.19.5
loom_version=1.18.1
fabric_api_version=0.160.5+26.3
fabric_api_version_range=>=0.160.5
# Mapping metadata kept for reference while building this Fabric Loom port.
mapping_channel=official
mapping_version=26.3
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class.
mod_id=cluttered
# The human-readable display name for the mod.
mod_name=Cluttered
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU GPL 3.0
# The mod version. Format: upstream-Minecraft-port-loader-status.
mod_version=3.0.3-26.3-0.3.0-fabric-unofficial
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=net.redchujelly
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=blake, YellowChuJelly
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A furniture mod that adds unique decorations from various media. Unofficial Fabric port for Minecraft 26.3.

# Publishing
curseforge_project_id=1545340
